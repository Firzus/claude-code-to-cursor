# Development overrides. Loads docker-compose.yml via Compose "include".
# Run: docker compose -f docker-compose.dev.yml up
include:
  - path: docker-compose.yml

services:
  api:
    volumes:
      - .:/app
      - /app/node_modules
      - cctc-data:/data
    command: bun --hot run index.ts

  frontend:
    build:
      context: ./frontend
      target: deps
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    ports:
      - "3111:3111"
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    environment:
      - BACKEND_URL=http://api:8082
      - BACKEND_SETTINGS_KEY=${SETTINGS_API_KEY:-}
      - NEXT_TELEMETRY_DISABLED=1

volumes:
  frontend-node-modules:
  frontend-next-cache:
