services:
  # Detached prod app — only started when you pass `--profile prod`.
  # Dev mode (`pnpm dev`) skips this service: the host's `next dev` listens
  # on 127.0.0.1:3111 instead. Either way, the same Cloudflare tunnel target
  # `host.docker.internal:3111` reaches whichever process is bound there.
  app:
    profiles: ["prod"]
    build: .
    container_name: cctc-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3111}:3111"
    env_file: .env
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      # Server-side calls (route handlers, RSC) reach Convex via the docker
      # network DNS name.
      - CONVEX_SELF_HOSTED_URL=http://convex:3210
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY}
      # Browser-side: the bundle baked at build time uses the host loopback
      # so a developer's local browser can still hit Convex for real-time
      # hooks. Remote browsers (over the tunnel) won't reach it — fine,
      # the dashboard falls back to SWR via /api/* server-side fetches.
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-http://127.0.0.1:3210}
      - INTERNAL_URL=http://127.0.0.1:3111
    depends_on:
      convex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3111/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: cctc-convex
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Bound to loopback only — both `pnpm run dev` on the host and the
      # local CLI reach Convex via 127.0.0.1:3210.
      - "127.0.0.1:${CONVEX_PORT:-3210}:3210"
      - "127.0.0.1:${CONVEX_SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - cctc-convex-data:/convex/data
    environment:
      - INSTANCE_NAME=${CONVEX_INSTANCE_NAME:-cctc}
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET:?Set CONVEX_INSTANCE_SECRET in .env}
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${CONVEX_PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${CONVEX_SITE_PROXY_PORT:-3211}}
      - DISABLE_BEACON=${CONVEX_DISABLE_BEACON:-true}
      - DISABLE_METRICS_ENDPOINT=true
      - RUST_LOG=${CONVEX_RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s
      retries: 3
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: cctc-convex-dashboard
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      # Browser-side URL — the dashboard runs in the user's browser and talks
      # to the backend over the host loopback.
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_DASHBOARD_DEPLOYMENT_URL:-http://127.0.0.1:${CONVEX_PORT:-3210}}
    depends_on:
      convex:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  cloudflared:
    image: cloudflare/cloudflared:2025.4.0
    container_name: cctc-cloudflared
    restart: unless-stopped
    # `--metrics 0.0.0.0:2000` exposes the official cloudflared metrics +
    # `/ready` JSON endpoint inside the container. We then publish only
    # 127.0.0.1:2000 on the host so the Next.js dashboard can poll it without
    # leaking the endpoint to the public network.
    command: tunnel --metrics 0.0.0.0:2000 --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    ports:
      - "127.0.0.1:2000:2000"
    networks:
      - internal
    extra_hosts:
      # Public hostname (Cloudflare Zero Trust dashboard) is set to
      # `http://host.docker.internal:3111` — the tunnel forwards Cursor
      # traffic to the `pnpm run dev` server running on the host.
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  internal:
    driver: bridge

volumes:
  cctc-convex-data:
